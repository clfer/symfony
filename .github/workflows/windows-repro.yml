name: Windows flaky repro

# Reproduce Windows-only flaky tests in a loop. Never meant for an upstream PR.
on:
  push: { branches: [ 'ci-windows-repro', 'ci-repro-attr-route-oom' ] }
  workflow_dispatch:
    inputs:
      filter: { description: 'phpunit --filter', default: '/(Session|Fragment|Profiler)Test/' }
      path: { description: 'test path', default: 'src\Symfony\Bundle\FrameworkBundle\Tests\Functional' }
      iterations: { description: 'iterations per phase', default: '100' }

permissions:
  contents: read

jobs:
  repro:
    name: x86 / all extensions / lowest-php (repro, opcache.enable_cli=1 as before #68270)
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      COMPOSER_NO_INTERACTION: '1'
      SYMFONY_PHPUNIT_DISABLE_RESULT_CACHE: '1'
      FILTER: ${{ inputs.filter || '/(Session|Fragment|Profiler)Test/' }}
      TEST_PATH: ${{ inputs.path || 'src\Symfony\Bundle\FrameworkBundle\Tests\Functional' }}
      ITERATIONS: ${{ inputs.iterations || '100' }}

    steps:
      - name: Setup Git
        run: |
          git config --global core.autocrlf false
          git config --global user.email ""
          git config --global user.name "Symfony"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup PHP (same as windows.yml all extensions, 7.4)
        run: |
          $env:Path = 'c:\php;' + $env:Path
          mkdir c:\php && cd c:\php
          iwr -MaximumRetryCount 5 -RetryIntervalSec 10 -outf php.zip https://github.com/symfony-tools/binary-utils/releases/download/v0.1/php-8.2.0-Win32-vs16-x86.zip
          7z x php.zip -y >nul
          cd ext
          iwr -MaximumRetryCount 5 -RetryIntervalSec 10 -outf php_apcu.zip https://github.com/symfony-tools/binary-utils/releases/download/v0.1/php_apcu-5.1.22-8.2-ts-vs16-x86.zip
          7z x php_apcu.zip -y >nul
          iwr -MaximumRetryCount 5 -RetryIntervalSec 10 -outf php_igbinary.zip https://github.com/symfony-tools/binary-utils/releases/download/v0.1/php_igbinary-3.2.16-8.2-ts-vs16-x86.zip
          7z x php_igbinary.zip -y >nul
          iwr -MaximumRetryCount 5 -RetryIntervalSec 10 -outf php_redis.zip https://github.com/symfony-tools/binary-utils/releases/download/v0.1/php_redis-6.2.0-8.2-ts-vs16-x86.zip
          7z x php_redis.zip -y >nul
          cd ..
          Copy php.ini-development php.ini
          "memory_limit=-1" >> php.ini
          "serialize_precision=-1" >> php.ini
          "max_execution_time=1200" >> php.ini
          "post_max_size=2047M" >> php.ini
          "upload_max_filesize=2047M" >> php.ini
          "date.timezone=`"America/Los_Angeles`"" >> php.ini
          "extension_dir=ext" >> php.ini
          "extension=php_xsl.dll" >> php.ini
          "extension=php_mbstring.dll" >> php.ini
          "zend_extension=php_opcache.dll" >> php.ini
          "opcache.enable_cli=1" >> php.ini
          "extension=php_openssl.dll" >> php.ini
          "extension=php_apcu.dll" >> php.ini
          "extension=php_igbinary.dll" >> php.ini
          "extension=php_redis.dll" >> php.ini
          "apc.enable_cli=1" >> php.ini
          "extension=php_intl.dll" >> php.ini
          "extension=php_fileinfo.dll" >> php.ini
          "extension=php_pdo_sqlite.dll" >> php.ini
          "extension=php_curl.dll" >> php.ini
          "extension=php_sodium.dll" >> php.ini
          "intl.default_locale=en" >> php.ini
          "intl.error_level=0" >> php.ini
          cd ${{ github.workspace }}
          iwr -MaximumRetryCount 5 -RetryIntervalSec 10 -outf composer.phar https://getcomposer.org/download/latest-stable/composer.phar

      - name: Install dependencies
        run: |
          $env:Path = 'c:\php;' + $env:Path
          mkdir $env:APPDATA\Composer && Copy .github\composer-config.json $env:APPDATA\Composer\config.json
          $env:SYMFONY_VERSION=(Select-String -CaseSensitive -Pattern " VERSION =" -SimpleMatch -Path src/Symfony/Component/HttpKernel/Kernel.php | Select Line | Select-String -Pattern "([0-9][0-9]*\.[0-9])").Matches.Value
          $env:COMPOSER_ROOT_VERSION=$env:SYMFONY_VERSION + ".x-dev"
          php .github/build-packages.php HEAD^ $env:SYMFONY_VERSION src\Symfony\Bridge\PhpUnit
          php composer.phar update --no-progress --ansi
          php phpunit install
          php -v; php -m
          exit 0

      - name: Phase A - tests alone
        continue-on-error: true
        run: |
          $env:Path = 'c:\php;' + $env:Path
          $fail = 0
          for ($i = 1; $i -le [int]$env:ITERATIONS; $i++) {
            $out = & php phpunit $env:TEST_PATH --filter $env:FILTER 2>&1 | Out-String
            if ($i -eq 1) { Write-Host (($out -replace "`e\[[0-9;]*m", '') -split "`n" | Select-String -Pattern '^(OK \(|Tests:)') }
            if ($LASTEXITCODE -ne 0) {
              $fail++
              Write-Host "::group::Phase A failure #$fail (iteration $i)"
              Write-Host $out
              Write-Host "::endgroup::"
            }
          }
          Write-Host "PHASE A RESULT: $fail failures / $env:ITERATIONS"

      - name: Phase B - tests under CPU contention
        continue-on-error: true
        run: |
          $env:Path = 'c:\php;' + $env:Path
          # Busy loops on every core, like the real job running src\Symfony in parallel
          $burners = 1..([Environment]::ProcessorCount) | ForEach-Object {
            Start-Job -ScriptBlock { & c:\php\php.exe -r 'while (true) { hash("sha256", random_bytes(4096)); }' }
          }
          $fail = 0
          for ($i = 1; $i -le [int]$env:ITERATIONS; $i++) {
            $out = & php phpunit $env:TEST_PATH --filter $env:FILTER 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              $fail++
              Write-Host "::group::Phase B failure #$fail (iteration $i)"
              Write-Host $out
              Write-Host "::endgroup::"
            }
          }
          $burners | Stop-Job; Get-Process php -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*random_bytes*' } | Stop-Process -Force
          Write-Host "PHASE B RESULT: $fail failures / $env:ITERATIONS"

      - name: Phase C - fresh process links AttributeRouteControllerLoader
        continue-on-error: true
        run: |
          $env:Path = 'c:\php;' + $env:Path
          $fail = 0; $n = [int]$env:ITERATIONS * 20
          for ($i = 1; $i -le $n; $i++) {
            $out = & php -r "require 'vendor/autoload.php'; echo class_exists('Symfony\Bundle\FrameworkBundle\Routing\AttributeRouteControllerLoader') ? 'LINKED' : 'MISSING';" 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $out.Trim() -ne 'LINKED') {
              $fail++
              Write-Host "::group::Phase C failure #$fail (iteration $i)"
              Write-Host $out
              Write-Host "::endgroup::"
            }
          }
          Write-Host "PHASE C RESULT: $fail failures / $n"
